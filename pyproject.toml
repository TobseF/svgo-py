[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svgo-py"
version = "4.1.0"
description = "Pure-Python reimplementation of SVGO (SVG Optimizer). Optimize/minify SVG without a JS interpreter."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tobse", email = "Public.Tobse@gmail.com" }]
keywords = ["svg", "svgo", "optimize", "minify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tinycss2>=1.2",
    "cssselect>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pysvgo = "svgo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svgo = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
