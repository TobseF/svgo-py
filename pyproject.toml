[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svgo"
version = "4.1.0"
description = "Pure-Python reimplementation of SVGO (SVG Optimizer). Optimize/minify SVG without a JS interpreter."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Python port" }]
keywords = ["svg", "svgo", "optimize", "minify"]
dependencies = [
    "tinycss2>=1.2",
    "cssselect>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pysvgo = "svgo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svgo = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
